# Include this location inside the HTTPS `server` block for mcoe.ir.
# The stable public URL stays unchanged when the versioned APK is replaced.

location = /downloads/lms/mcoe-lms-android.apk {
    alias /srv/mcoe/shared/downloads/lms/mcoe-lms-android.apk;
    default_type application/vnd.android.package-archive;

    add_header Content-Disposition 'attachment; filename="mcoe-lms-android.apk"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'no-cache';
}
