upstream mcoe_backend {
    server unix:/run/mcoe/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;

    server_name api.mcoe.ir;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/mcoe/shared/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/mcoe/shared/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://mcoe_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
