upstream mcoe_backend {
    server unix:/run/mcoe/gunicorn.sock;
}

server {

    server_name api.mcoe.ir;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/mcoe/shared/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/mcoe/shared/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://mcoe_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.mcoe.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.mcoe.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.mcoe.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name api.mcoe.ir;
    return 404; # managed by Certbot


}