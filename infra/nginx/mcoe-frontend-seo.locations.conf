# Merge these locations into the existing HTTPS server block for mcoe.ir.
# The server block must already contain:
#
#   root /srv/mcoe/frontend/current;
#   index index.html;
#
# Do not include this file alongside another `location /` block.

location = /robots.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
}

location = /sitemap.xml {
    proxy_pass http://mcoe_backend/api/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    return 301 /;
}

# Snapshot files are implementation details. Public URLs stay extensionless.
location ~ ^(.+)\.html$ {
    return 301 $1$is_args$args;
}

# Private and utility routes remain client-rendered and must never be indexed.
location ~ ^/(dashboard|login|forgot-password|reset-password|register|search)(/|$) {
    try_files $uri.html $uri /index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
}

# Public dynamic records still work immediately if a record is added after the
# most recent frontend build. The next build gives the record its own snapshot.
location ~ ^/(articles|news|events)/[^/]+/?$ {
    try_files $uri.html $uri /index.html;
    add_header Cache-Control "no-cache";
}

location ~ ^/working-groups/[^/]+/?$ {
    try_files $uri.html $uri /index.html;
    add_header Cache-Control "no-cache";
}

# High-value legacy WordPress URLs that still appear in search results.
location ~ ^/دبستان/?$ {
    return 301 /levels/elementary1;
}

location ~ ^/ریدایرکت/?$ {
    return 301 /;
}

location ~ ^/ادبیات-فارسی-و-زبانهای-خارجی/?$ {
    return 301 /working-groups;
}

location ~ ^/کارگروه-it-و-هوش-مصنوعی/?$ {
    return 301 /working-groups/computer-information-technology;
}

location ~ ^/کارگروه-مطالعات-اجتماعی-2/?$ {
    return 301 /working-groups/social-studies;
}

location ~ ^/کارگروه-معنویت-و-آموزه-های-قرآنی/?$ {
    return 301 /working-groups/spirituality-quranic-teachings;
}

location ~ ^/ثبت-نام-رویداد(-2)?/?$ {
    return 301 /events;
}

location ~ ^/رزومه-شهره-صادقی/?$ {
    return 301 /working-groups;
}

# Consolidate duplicate trailing-slash variants on the extensionless URL.
location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
}

location = / {
    if ($arg_page_id = 5368) {
        return 301 https://mcoe.ir/;
    }

    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

# Build-generated route directories are served directly. Unknown public URLs
# return a real 404 instead of an index.html response with HTTP 200.
location / {
    try_files $uri.html $uri =404;
    add_header Cache-Control "no-cache";
}

error_page 404 /404.html;

location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
